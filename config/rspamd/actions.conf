# Score thresholds from PLAN.md section 10.1. The principle behind them is
# that mail is refused during the SMTP session or delivered, never accepted
# and silently discarded: a silent discard loses legitimate mail with nobody
# aware of it.
reject = 15;          # refuse with 550 5.7.1
add_header = 4;       # tag as spam and let Sieve file it into Junk
greylist = 9;         # ask the sender to retry
